trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)
resources:
  pipelines:
    - pipeline: "apis-of-dotnet-build"
      project: "OnlineServices"
      source: 'dev-comm-partners\builds\apis-of-dotnet-build'
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    stages:
      - stage: Dev
        displayName: Deploy to Dev
        jobs:
          - job: Job_1
            displayName: Run on agent
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-build"
                  artifactName: "apis-of-dotnet-drop"
                  targetPath: "$(Pipeline.Workspace)/apis-of-dotnet-drop"
            steps:
              - template: /pipelines/templates/steps-deploy-run-from-package.yml@self
                parameters:
                  displayName: Deploy Web App (package from storage)
                  azureSubscriptionConnection: "$(AzureDevSubscriptionConnection)"
                  resourceGroupName: apisofdotnet-dev
                  appName: apisofdotnet-dev
                  appType: webapp
                  storageAccountName: apisofdotnetdev
                  blobName: main-site/main-site-$(Build.BuildNumber).zip
                  packagePath: $(Pipeline.Workspace)/apis-of-dotnet-drop/site.zip
      - stage: Production
        displayName: Deploy to Production
        # dependsOn: DR
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
          - job: Job_1
            displayName: Run on agent
            dependsOn: PreDeploymentApprovalJob
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-build"
                  artifactName: "apis-of-dotnet-drop"
                  targetPath: "$(Pipeline.Workspace)/apis-of-dotnet-drop"
            steps:
              - task: AzureWebApp@1
                displayName: Deploy Web App
                inputs:
                  azureSubscription: dotnetwebsite-azure
                  appName: apisofdotnet
                  appType: webAppLinux
                  package: $(Pipeline.Workspace)/apis-of-dotnet-drop/site.zip
                  deploymentMethod: auto
