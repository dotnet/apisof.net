---
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pipelines/build-planner.yml
      - src/NetUpgradePlanner/**
      - src/Terrajobst.ApiCatalog/**
      - src/Terrajobst.NetUpgradePlanner/**
      - src/Terrajobst.NetUpgradePlanner.Excel/**
      - src/Terrajobst.UsageCrawling/**
name: $(date:yyyyMMdd)$(rev:.r)
variables:
  BuildConfiguration: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: true
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: DeployPlanner
        jobs:
          - job: build_and_deploy
            displayName: Build and deploy planner
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: "Publish velopack release"
                  targetPath: $(Build.ArtifactStagingDirectory)/velopack-release
                  artifactName: velopack-release
            steps:
              - checkout: self
                fetchDepth: 0 # We need the full history in order to use Git versioning
              - task: UseDotNet@2
                displayName: Use .NET 8 SDK
                inputs:
                  version: 8.x
              - task: NuGetAuthenticate@1
                displayName: "NuGet Authenticate"
              - script: |
                  dotnet tool update -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources || dotnet tool install -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources
                  nbgv cloud -p src/NetUpgradePlanner
                displayName: "Set build version (nbgv)"
              - script: |
                  cd src/NetUpgradePlanner
                  dotnet publish /p:SourceRevisionId=$(Build.SourceVersion)
                displayName: "dotnet publish"
              - script: |
                  dotnet tool update -g vpk --ignore-failed-sources || dotnet tool install -g vpk --ignore-failed-sources
                displayName: "Install vpk"
              - task: AzureCLI@2
                displayName: "Download existing velopack releases"
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/velopack-release" | Out-Null
                    az storage blob download-batch --destination "$(Build.ArtifactStagingDirectory)/velopack-release" --source squirrel --account-name $(StorageAccountName) --auth-mode login --overwrite --pattern "*.nupkg"
                    az storage blob download-batch --destination "$(Build.ArtifactStagingDirectory)/velopack-release" --source squirrel --account-name $(StorageAccountName) --auth-mode login --overwrite --pattern "releases.*.json"

              - powershell: |
                  Set-Location ".artifacts/publish/NetUpgradePlanner"

                  $releaseDir = "$(Build.ArtifactStagingDirectory)/velopack-release"
                  $version = $env:PLANNER_SEMVER1

                  if ([string]::IsNullOrWhiteSpace($version)) {
                    throw "NBGV version variable is missing. Ensure 'nbgv cloud -p src/NetUpgradePlanner' completed successfully."
                  }

                  $existing = Get-ChildItem -Path $releaseDir -Filter "NetUpgradePlanner-$version-full.nupkg" -ErrorAction SilentlyContinue

                  if ($existing) {
                    Write-Host "Version $version already exists in velopack release feed; skipping pack to avoid 409 conflict."
                    Write-Host "##vso[task.setvariable variable=PlannerVersionExists]true"
                  }
                  else {
                    vpk pack --packId "NetUpgradePlanner" --packTitle ".NET Upgrade Planner" --packVersion "$version" --packAuthors "Immo Landwerth" --packDir "." --framework net8-x64-desktop --mainExe NetUpgradePlanner.exe --outputDir "$releaseDir"
                    Write-Host "##vso[task.setvariable variable=PlannerVersionExists]false"
                  }
                displayName: "vpk pack"
                env:
                  PLANNER_SEMVER1: $(GitBuildVersionSimple)
              - task: AzureCLI@2
                displayName: "Upload release to Azure Storage"
                condition: and(succeeded(), ne(variables['PlannerVersionExists'], 'true'))
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    az storage blob upload-batch --destination squirrel --source "$(Build.ArtifactStagingDirectory)/velopack-release" --account-name $(StorageAccountName) --auth-mode login --overwrite
                
