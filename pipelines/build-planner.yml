---
trigger:
  branches:
    include:
      - "*"
    exclude:
      - main
  paths:
    include:
      - pipelines/build-planner.yml
      - pipelines/templates/steps-build-planner.yml
      - src/NetUpgradePlanner/**
      - src/Terrajobst.ApiCatalog/**
      - src/Terrajobst.NetUpgradePlanner/**
      - src/Terrajobst.NetUpgradePlanner.Excel/**
      - src/Terrajobst.UsageCrawling/**
name: $(date:yyyyMMdd)$(rev:.r)
variables:
  BuildConfiguration: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main
stages:
  - stage: BuildAndPublish
    jobs:
      - job: build_and_publish
        displayName: "Build and publish planner"
        templateContext:
          outputs:
            - output: pipelineArtifact
              displayName: "Publish planner release"
              targetPath: $(Build.ArtifactStagingDirectory)/planner-release
              artifactName: planner-release
        steps:
          - template: /pipelines/templates/steps-build-planner.yml@self