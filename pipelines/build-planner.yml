---
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pipelines/build-planner.yml
      - src/NetUpgradePlanner/**
      - src/Terrajobst.ApiCatalog/**
      - src/Terrajobst.NetUpgradePlanner/**
      - src/Terrajobst.NetUpgradePlanner.Excel/**
      - src/Terrajobst.UsageCrawling/**
name: $(date:yyyyMMdd)$(rev:.r)
variables:
  BuildConfiguration: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: true
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: DeployPlanner
        jobs:
          - job: build_and_deploy
            displayName: Build and deploy planner
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: "Publish squirrel release"
                  targetPath: $(Build.ArtifactStagingDirectory)/squirrel-release
                  artifactName: squirrel-release
            steps:
              - checkout: self
                fetchDepth: 0 # We need the full history in order to use Git versioning
              - task: UseDotNet@2
                displayName: Use .NET 8 SDK
                inputs:
                  version: 8.x
              - task: NuGetAuthenticate@1
                displayName: "NuGet Authenticate"
              - script: |
                  dotnet tool update -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources || dotnet tool install -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources
                  nbgv cloud -p src/NetUpgradePlanner
                displayName: "Set build version (nbgv)"
              - script: |
                  cd src/NetUpgradePlanner
                  dotnet publish /p:SourceRevisionId=$(Build.SourceVersion)
                displayName: "dotnet publish"
              - task: AzureCLI@2
                displayName: "Download existing squirrel releases"
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/squirrel-release" | Out-Null
                    az storage blob download-batch -d "$(Build.ArtifactStagingDirectory)/squirrel-release" -s squirrel --overwrite --pattern "*.nupkg"
                    az storage blob download-batch -d "$(Build.ArtifactStagingDirectory)/squirrel-release" -s squirrel --overwrite --pattern "RELEASES"
                env:
                  AZURE_STORAGE_CONNECTION_STRING: $(AzureStorageConnectionString)
              - powershell: |
                  New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/squirrel-release"
                  Set-Location ".artifacts/publish/NetUpgradePlanner"
                  Set-Alias Squirrel ($env:USERPROFILE + "\.nuget\packages\clowd.squirrel\2.11.1\tools\Squirrel.exe")

                  $releaseDir = "$(Build.ArtifactStagingDirectory)/squirrel-release"
                  $version = "$(NBGV_SemVer1)"
                  $existing = Get-ChildItem -Path $releaseDir -Filter "NetUpgradePlanner-$version-*.nupkg" -ErrorAction SilentlyContinue

                  if ($existing) {
                    Write-Host "Version $version already exists in squirrel release feed; skipping pack to avoid 409 conflict."
                    Write-Host "##vso[task.setvariable variable=PlannerVersionExists]true"
                  }
                  else {
                    Squirrel pack --framework net6.0,vcredist143-x86 --packId "NetUpgradePlanner" --packTitle ".NET Upgrade Planner" --packVersion "$version" --packAuthors "Immo Landwerth" --packDir "." -r "$releaseDir"
                    Write-Host "##vso[task.setvariable variable=PlannerVersionExists]false"
                  }
                displayName: "squirrel pack"
              - task: AzureCLI@2
                displayName: "Upload release to Azure Storage"
                condition: and(succeeded(), ne(variables['PlannerVersionExists'], 'true'))
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    az storage blob upload-batch -d squirrel -s "$(Build.ArtifactStagingDirectory)/squirrel-release" --overwrite
                env:
                  AZURE_STORAGE_CONNECTION_STRING: $(AzureStorageConnectionString)
