---
parameters:
  - name: BuildType
    type: string
    default: dev
steps:
  - checkout: self
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      version: 8.x
      includePreviewVersions: true
  - task: NuGetAuthenticate@1
    displayName: "NuGet Authenticate"
  - script: |
      dotnet publish "$(Build.SourcesDirectory)/src/GenUsageNuGet/GenUsageNuGet.csproj" \
        --configuration $(BuildConfiguration) \
        --output "$(Build.ArtifactStagingDirectory)/${{ parameters.BuildType }}/publish-gen-usage-nuget"
    displayName: "Publish GenUsageNuGet"