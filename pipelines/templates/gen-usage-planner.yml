---
parameters:
  - name: ArtifactName
    type: string
    default: "gen-usage-planner-dev-drop"
steps:
  - checkout: self
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      version: 8.x
      includePreviewVersions: true
  - task: NuGetAuthenticate@1
    displayName: "NuGet Authenticate"
  - script: |
      dotnet publish "$(Build.SourcesDirectory)/src/GenUsagePlanner/GenUsagePlanner.csproj" \
        --configuration $(BuildConfiguration) \
        --output "$(Build.ArtifactStagingDirectory)/publish-gen-usage-planner"
    displayName: "Publish GenUsagePlanner"