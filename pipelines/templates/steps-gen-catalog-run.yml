parameters:
  - name: AzureSubscriptionConnection
    type: string

steps:
  - task: NugetAuthenticate@1
    displayName: "Authenticate with NuGet feed"
  - task: UseDotNet@2
    displayName: "Install .NET 10"
    inputs:
      packageType: sdk
      version: 10.x
      includePreviewVersions: true
  - task: UseDotNet@2
    displayName: "Install .NET 11"
    inputs:
      packageType: sdk
      version: 11.x
      includePreviewVersions: true
  - task: PowerShell@2
    displayName: "Run DumpPacks"
    inputs:
      targetType: "inline"
      pwsh: true
      script: |
        $genCatalogPublishPath = "$(Pipeline.Workspace)\gen-catalog-drop\publish-gen-catalog"
        $dumpPacksDllPath = "$(Pipeline.Workspace)\gen-catalog-drop\publish-dumppacks\DumpPacks.dll"
        $dumpPacksOutputPath = Join-Path $genCatalogPublishPath "dumppack_output.json"

        if (-not (Test-Path $genCatalogPublishPath)) {
          throw "GenCatalog publish directory does not exist at '$genCatalogPublishPath'."
        }

        if (-not (Test-Path $dumpPacksDllPath)) {
          throw "DumpPacks DLL does not exist at '$dumpPacksDllPath'."
        }

        dotnet $dumpPacksDllPath > $dumpPacksOutputPath
        if ($LASTEXITCODE -ne 0) {
          throw "DumpPacks failed with exit code $LASTEXITCODE."
        }

        if (-not (Test-Path $dumpPacksOutputPath)) {
          throw "DumpPacks output file was not created at '$dumpPacksOutputPath'."
        }

        try {
          Get-Content -Raw -Path $dumpPacksOutputPath | ConvertFrom-Json | Out-Null
        }
        catch {
          Write-Host "DumpPacks output is not valid JSON. First 20 lines:"
          Get-Content -Path $dumpPacksOutputPath -TotalCount 20 | ForEach-Object { Write-Host $_ }
          throw
        }
    env:
      DOTNET_ROOT: $(Agent.ToolsDirectory)/dotnet
  - task: AzureCLI@2
    displayName: "Run GenCatalog"
    timeoutInMinutes: 0
    inputs:
      azureSubscription: "${{ parameters.AzureSubscriptionConnection }}"
      scriptType: "pscore"
      scriptLocation: "inlineScript"
      addSpnToEnvironment: true
      inlineScript: |
        $env:APISOFDOTNET_INDEX_PATH = "$(Pipeline.Workspace)\catalog"
        $genCatalogPublishPath = "$(Pipeline.Workspace)\gen-catalog-drop\publish-gen-catalog"
        $dumpPacksOutputPath = Join-Path $genCatalogPublishPath "dumppack_output.json"

        if (Test-Path $env:APISOFDOTNET_INDEX_PATH) {
          Remove-Item -Recurse -Force $env:APISOFDOTNET_INDEX_PATH
        }

        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/index" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/frameworks" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/packs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/packages" | Out-Null

        if (-not (Test-Path $dumpPacksOutputPath)) {
          throw "DumpPacks output file is missing at '$dumpPacksOutputPath'."
        }

        dotnet (Join-Path $genCatalogPublishPath "GenCatalog.dll")
    env:
      AzureStorageServiceUrl: $(AzureStorageServiceUrl)
      ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecret)
      APISOFDOTNET_INDEX_PATH: $(Pipeline.Workspace)\catalog
      DOTNET_gcServer: 0
      DOTNET_GCConserveMemory: 9
      DOTNET_GCHeapHardLimitPercent: 75
      DOTNET_GCHeapHardLimit: 5368709120

