parameters:
  - name: AzureSubscriptionConnection
    type: string

steps:
  - task: NugetAuthenticate@1
    displayName: "Authenticate with NuGet feed"
  - task: UseDotNet@2
    displayName: "Install .NET 10"
    inputs:
      packageType: runtime
      version: 10.x
      includePreviewVersions: true
      installationPath: $(Pipeline.Workspace)\dotnet
  - task: AzureCLI@2
    displayName: "Run GenCatalog"
    timeoutInMinutes: 0
    inputs:
      azureSubscription: "${{ parameters.AzureSubscriptionConnection }}"
      scriptType: "pscore"
      scriptLocation: "inlineScript"
      addSpnToEnvironment: true
      inlineScript: |
        $env:APISOFDOTNET_INDEX_PATH = "$(Pipeline.Workspace)/catalog"
        if (Test-Path $env:APISOFDOTNET_INDEX_PATH) {
          Remove-Item -Recurse -Force $env:APISOFDOTNET_INDEX_PATH
        }

        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/index" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/frameworks" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/packs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$env:APISOFDOTNET_INDEX_PATH/packages" | Out-Null

        $publishDir = "$(Pipeline.Workspace)/gen-catalog-drop/publish-gen-catalog"
        $runtimeRoot = "$(Pipeline.Workspace)\dotnet"

        if (-not (Test-Path $publishDir)) {
          throw "Publish directory not found: $publishDir"
        }

        if (-not (Test-Path $runtimeRoot)) {
          throw "Runtime root not found at: $runtimeRoot"
        }

        $env:DOTNET_ROOT = $runtimeRoot
        $env:PATH = "$env:DOTNET_ROOT;$env:PATH"

        Set-Location "$publishDir"
        where.exe dotnet
        dotnet --list-runtimes
        dotnet GenCatalog.dll
    env:
      AzureStorageServiceUrl: $(AzureStorageServiceUrl)
      ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecret)
      APISOFDOTNET_INDEX_PATH: $(Pipeline.Workspace)/catalog
      DOTNET_gcServer: 0
      DOTNET_GCConserveMemory: 9
      DOTNET_GCHeapHardLimitPercent: 75
      DOTNET_GCHeapHardLimit: 5368709120

