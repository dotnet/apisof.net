---
parameters:
steps:
  - checkout: self
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      version: 8.x
  - script: |
      dotnet publish "$(Build.SourcesDirectory)/src/GenUsage/GenUsage.csproj" \
        --configuration $(BuildConfiguration) \
        --output "$(Build.ArtifactStagingDirectory)/publish"
    displayName: "Publish GenUsage"
