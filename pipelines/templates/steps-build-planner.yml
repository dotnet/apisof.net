parameters:
  - name: azureSubscriptionConnection
    type: string
  - name: storageAccountName
    type: string
steps:
  - checkout: self
    fetchDepth: 0 # We need the full history in order to use Git versioning
  - task: NuGetAuthenticate@1
    displayName: "NuGet Authenticate"
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      version: 8.x
  - script: |
      dotnet tool update -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources || dotnet tool install -g nbgv --configfile "$(Build.SourcesDirectory)/src/nuget.config" --ignore-failed-sources
      nbgv cloud -p src/NetUpgradePlanner
    displayName: "Set build version (nbgv)"
  - script: |
      cd src/NetUpgradePlanner
      dotnet publish /p:SourceRevisionId=$(Build.SourceVersion) /p:EnableWindowsTargeting=true
    displayName: "dotnet publish"
  - powershell: |
      $version = $env:PLANNER_SEMVER1

      if ([string]::IsNullOrWhiteSpace($version)) {
        throw "NBGV version variable is missing. Ensure 'nbgv cloud -p src/NetUpgradePlanner' completed successfully."
      }

      $inputRoot = "$(Build.ArtifactStagingDirectory)/velopack-input"
      $publishDestination = Join-Path $inputRoot "publish/NetUpgradePlanner"

      New-Item -ItemType Directory -Force -Path $publishDestination | Out-Null
      Copy-Item -Path ".artifacts/publish/NetUpgradePlanner/*" -Destination $publishDestination -Recurse -Force
      Copy-Item -Path "src/nuget.config" -Destination (Join-Path $inputRoot "nuget.config") -Force
      Set-Content -Path (Join-Path $inputRoot "planner-version.txt") -Value $version -NoNewline
    displayName: "Prepare velopack inputs"
    env:
      PLANNER_SEMVER1: $(GitBuildVersionSimple)