parameters:
  - name: azureSubscriptionConnection
    type: string
  - name: storageAccountName
    type: string

steps:
  - task: AzureCLI@2
    displayName: "Upload release to Azure Storage"
    condition: and(succeeded(), ne(variables['PlannerVersionExists'], 'true'))
    inputs:
      azureSubscription: "${{ parameters.azureSubscriptionConnection }}"
      scriptType: "pscore"
      scriptLocation: "inlineScript"
      inlineScript: |
        az storage blob upload-batch --destination squirrel --source "$(Build.ArtifactStagingDirectory)/velopack-release" --account-name ${{ parameters.storageAccountName }} --auth-mode login --overwrite
