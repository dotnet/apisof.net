# stages-gen-usage.yml
# Reusable stages for GenUsage pipelines (dev/prod)

parameters:
  - name: StageName
    type: string
    default: GenerateUsage
  - name: StageDisplayName
    type: string
    default: Generate usage artifacts
  - name: BuildType
    type: string
    default: "dev"
stages:
  - stage: ${{ parameters.StageName }}
    displayName: ${{ parameters.StageDisplayName }}
    jobs:
      - job: generate_nuget_usage_artifact
        displayName: Generate nuget usage artifact
        timeoutInMinutes: 0
        cancelTimeoutInMinutes: 5
        templateContext:
          outputs:
            - output: pipelineArtifact
              displayName: Publish GenUsageNuGet Artifact
              targetPath: $(Build.ArtifactStagingDirectory)/${{ parameters.BuildType }}/publish-gen-usage-nuget
              artifactName: gen-usage-nuget-${{ parameters.BuildType }}-drop
        steps:
          - template: /templates/gen-usage-nuget.yml@self
            parameters:
              BuildType: ${{ parameters.BuildType }}

      - job: generate_planner_usage_artifact
        displayName: Generate planner usage artifact
        timeoutInMinutes: 0
        cancelTimeoutInMinutes: 5
        templateContext:
          outputs:
            - output: pipelineArtifact
              displayName: Publish GenUsagePlanner Artifact
              targetPath: $(Build.ArtifactStagingDirectory)/${{ parameters.BuildType }}/publish-gen-usage-planner
              artifactName: gen-usage-planner-${{ parameters.BuildType }}-drop
        steps:
          - template: /templates/gen-usage-planner.yml@self
            parameters:
              BuildType: ${{ parameters.BuildType }}

      - job: generate_usage_artifact
        displayName: Generate usage artifact
        timeoutInMinutes: 0
        cancelTimeoutInMinutes: 5
        templateContext:
          outputs:
            - output: pipelineArtifact
              displayName: Publish GenUsage Artifact
              targetPath: $(Build.ArtifactStagingDirectory)/${{ parameters.BuildType }}/publish-gen-usage
              artifactName: gen-usage-${{ parameters.BuildType }}-drop
        steps:
          - template: /templates/steps-gen-usage.yml@self
            parameters:
              BuildType: ${{ parameters.BuildType }}