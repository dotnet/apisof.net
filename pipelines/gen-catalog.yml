trigger: none
variables:
  - name: BuildConfiguration
    value: Release
  - name: TeamName
    value: DevDiv
schedules:
  - cron: "21 12 * * *"   # 12:21 PM UTC
    displayName: Daily 12:21 UTC
    branches:
      include:
        - main
    always: true

name: $(date:yyyyMMdd)$(rev:.r)

resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: AzurePipelines-EO
        image: 1ESPT-Windows2022
        os: windows
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    stages: 
      - template: /pipelines/templates/steps-gen-catalog-build.yml@self
        parameters:
          StageName: BuildCatalogDev
          StageDisplayName: Build Catalog Dev Artifact
          BuildConfiguration: $(BuildConfiguration)
          BuildType: dev
      - template: /pipelines/templates/steps-gen-catalog-build.yml@self
        parameters:
          StageName: BuildCatalogProd
          StageDisplayName: Build Catalog Prod Artifact
          BuildConfiguration: $(BuildConfiguration)
          BuildType: prod
      