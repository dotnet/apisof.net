trigger: none
variables:
  - name: BuildConfiguration
    value: Release
schedules:
  - cron: "21 12 * * *"   # 12:21 PM UTC
    displayName: Daily 12:21 UTC
    branches:
      include:
        - main
    always: true

name: $(date:yyyyMMdd)$(rev:.r)

resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: AzurePipelines-EO
        image: 1ESPT-Windows2022
        os: windows
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    stages: 
      - stage: BuildAndPublishArtifact
        displayName: Build and publish artifact
        jobs:
        - job: generate_catalog_job
          displayName: "Build Catalog Generator Artifact"
          timeoutInMinutes: 0
          cancelTimeoutInMinutes: 5
          templateContext:
            outputs:
              - output: pipelineArtifact
                displayName: "Publish catalog artifact"
                targetPath: $(Build.ArtifactStagingDirectory)/gen-catalog-drop
                artifactName: gen-catalog-drop
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0
          - task: UseDotNet@2
            displayName: "Install .NET 8"
            inputs:
              packageType: sdk
              version: 8.x
          - task: NuGetAuthenticate@1
            displayName: "NuGet Authenticate"
          - script: |
              dotnet publish "$(Build.SourcesDirectory)/src/GenCatalog/GenCatalog.csproj" \
                --configuration $(BuildConfiguration) \
                --output "$(Build.ArtifactStagingDirectory)/gen-catalog-drop/publish-gen-catalog"
            displayName: "Publish GenCatalog"