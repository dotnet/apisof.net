---
trigger: none
name: $(date:yyyyMMdd)$(rev:.r)
variables:
  BuildConfiguration: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

schedules:
  - cron: "5 21 * * 2,4" # At 21:05 on Tuesday and Thursday
    displayName: "Generate design notes every Tuesday and Thursday"
    branches:
      include:
        - main
    always: true

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: true
      baseline:
        baselineSet: default
        baselineBranch: main
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - template: /pipelines/templates/steps-gen-design-notes.yml@self
        displayName: "Generate design notes Dev"
        parameters:
          BuildType: "dev"
          StageName: "GenerateDesignNotesDev"
          StageDisplayName: "Generate design notes Dev Artifact"
      - template: /pipelines/templates/steps-gen-design-notes.yml@self
        displayName: "Generate design notes Prod"
        parameters:
          BuildType: "prod"
          StageName: "GenerateDesignNotesProd"
          StageDisplayName: "Generate design notes Prod Artifact"