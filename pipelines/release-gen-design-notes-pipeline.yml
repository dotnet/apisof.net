trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)

schedules:
  - cron: "5 21 * * 2,4" # At 21:05 on Tuesday and Thursday
    displayName: "Generate design notes every Tuesday and Thursday"
    branches:
      include:
        - main
    always: true

resources:
  pipelines:
    - pipeline: "gen-design-notes"
      project: "OnlineServices"
      source: 'ASP-IIS-dotnet\builds\gen-design-notes'
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows
    stages:
      - stage: Dev
        displayName: Run in Dev
        jobs:
          - job: RunGenDesignNotesDev
            displayName: Run GenDesignNotes (Dev)
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-design-notes"
                  artifactName: "gen-design-notes-drop"
                  targetPath: "$(Pipeline.Workspace)/gen-design-notes-drop"
            steps:
              - task: AzureCLI@2
                displayName: "Upload GenDesignNotes Dev"
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnectionDev)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  addSpnToEnvironment: true
                  inlineScript: |
                    Set-Location "$(Pipeline.Workspace)/gen-design-notes-drop"
                    dotnet GenDesignNotes.dll
                env:
                  AzureStorageServiceUrl: $(AzureStorageServiceUrlDev)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecretDev)

      - stage: Production
        displayName: Run in Production
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com

          - job: RunGenDesignNotesProd
            displayName: Upload GenDesignNotes Prod
            dependsOn: PreDeploymentApprovalJob
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-design-notes"
                  artifactName: "gen-design-notes-drop"
                  targetPath: "$(Pipeline.Workspace)/gen-design-notes-drop"
            steps:
              - task: AzureCLI@2
                displayName: "Run GenDesignNotes (Prod)"
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnectionProd)"
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  addSpnToEnvironment: true
                  inlineScript: |
                    Set-Location "$(Pipeline.Workspace)/gen-design-notes-drop"
                    dotnet GenDesignNotes.dll
                env:
                  AzureStorageServiceUrl: $(AzureStorageServiceUrlProd)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecretProd)
