trigger:
  branches:
    include:
      - main
name: $(Date:yyyyMMdd).$(Rev:r)

resources:
  pipelines:
    - pipeline: "gen-catalog"
      project: "OnlineServices"
      source: 'ASP-IIS-dotnet\builds\gen-catalog'
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release
extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    pool:
      name: VSEngSS-Microbuild2022-1ES
      os: windows
    stages:
      - stage: Dev
        displayName: Run in Dev
        jobs:
          - job: Job_1
            displayName: Run on agent
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-catalog"
                  artifactName: "gen-catalog-dev-drop"
                  targetPath: "$(Pipeline.Workspace)/gen-catalog-dev-drop"
            steps:
              - template: /pipelines/templates/steps-gen-catalog-run.yml@self
                parameters:
                  AzureSubscriptionConnection: "$(AzureSubscriptionConnectionDev)"
                  AzureStorageServiceUrl: "$(AzureStorageServiceUrlDev)"
                  ApisOfDotNetWebHookSecret: "$(ApisOfDotNetWebHookSecretDev)"
                  ArtifactRoot: "$(Pipeline.Workspace)/gen-catalog-dev-drop/publish-gen-catalog"

      - stage: Production
        displayName: Run in Production
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com

          - job: Job_1
            displayName: Run on agent
            dependsOn: PreDeploymentApprovalJob
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-catalog"
                  artifactName: "gen-catalog-prod-drop"
                  targetPath: "$(Pipeline.Workspace)/gen-catalog-prod-drop"
            steps:
              - template: /pipelines/templates/steps-gen-catalog-run.yml@self
                parameters:
                  AzureSubscriptionConnection: "$(AzureSubscriptionConnectionProd)"
                  AzureStorageServiceUrl: "$(AzureStorageServiceUrlProd)"
                  ApisOfDotNetWebHookSecret: "$(ApisOfDotNetWebHookSecretProd)"
                  ArtifactRoot: "$(Pipeline.Workspace)/gen-catalog-prod-drop/publish-gen-catalog"
