trigger: 
  branches:
    include:
      - main
name: $(Date:yyyyMMdd).$(Rev:r)

resources:
  pipelines:
    - pipeline: "gen-usage"
      project: "OnlineServices"
      source: 'ASP-IIS-dotnet\builds\gen-usage'
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    stages:
      - stage: Dev
        displayName: Run in Dev
        jobs:
          - job: Job_1
            displayName: Run on agent
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-usage"
                  artifactName: "dev-drop"
                  targetPath: "$(Pipeline.Workspace)/dev-drop"
            steps:
              - template: /pipelines/templates/steps-gen-usage.yml@self
                parameters:
                  BuildType: "dev"
                  AzureSubscriptionConnection: "$(AzureDevSubscriptionConnectionDev)"
                  AzureStorageServiceUrl: "$(AzureStorageServiceUrlDev)"
                  ApisOfDotNetWebHookSecret: "$(ApisOfDotNetWebHookSecretDev)"

      - stage: Production
        displayName: Run in Production
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com

          - job: Job_1
            displayName: Run on agent
            dependsOn: PreDeploymentApprovalJob
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: "gen-usage"
                  artifactName: "prod-drop" 
                  targetPath: "$(Pipeline.Workspace)/prod-drop"
            steps:
              - template: /pipelines/templates/steps-gen-usage.yml@self
                parameters:
                  BuildType: "prod"
                  AzureSubscriptionConnection: "$(AzureProdSubscriptionConnectionProd)"
                  AzureStorageServiceUrl: "$(AzureStorageServiceUrlProd)"
                  ApisOfDotNetWebHookSecret: "$(ApisOfDotNetWebHookSecretProd)"