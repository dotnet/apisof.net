trigger: 
  branches:
    include:
      - main
name: $(Date:yyyyMMdd).$(Rev:r)

resources:
  pipelines:
    - pipeline: "apis-of-dotnet-gen-usage-build"
      project: "OnlineServices"
      source: 'ASP-IIS-dotnet\builds\gen-usage-pipeline'
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
    stages:
      - stage: Dev
        displayName: Run in Dev
        jobs:
          - job: Job_1
            displayName: Run on agent
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-nuget-drop"
                  targetPath: "$(Pipeline.Workspace)/dev/gen-usage-nuget-dev-drop"
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-planner-drop"
                  targetPath: "$(Pipeline.Workspace)/dev/gen-usage-planner-dev-drop"
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-drop"
                  targetPath: "$(Pipeline.Workspace)/dev/gen-usage-dev-drop"
            steps:
              - task: AzureCLI@2
                displayName: Run GenUsageNuGet (Dev)
                timeoutInMinutes: 0
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/dev/gen-usage-nuget-dev-drop/GenUsageNuGet.dll" -- crawl
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrl)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecret)
                  GENUSAGE_NUGET_CATALOG_DOP: "2"
                  GENUSAGE_NUGET_HTTP_TIMEOUT_SECONDS: "36000"
                  GENUSAGE_NUGET_CRAWL_TIMEOUT_HOURS: "3"
                  GENUSAGE_NUGET_CRAWL_WORKERS: "16"
              - task: AzureCLI@2
                displayName: Run GenUsagePlanner (Dev)
                timeoutInMinutes: 0
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/dev/gen-usage-planner-dev-drop/GenUsagePlanner.dll"
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrl)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecret)
              - task: AzureCLI@2
                displayName: Run GenUsage (Dev)
                dependsOn: 
                  - Run GenUsageNuGet (Dev)
                  - Run GenUsagePlanner (Dev)
                timeoutInMinutes: 0
                inputs:
                  azureSubscription: "$(AzureSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/dev/gen-usage-dev-drop/GenUsage.dll"
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrl)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecret)

      - stage: Production
        displayName: Run in Production
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com

          - job: Job_1
            displayName: Run on agent
            dependsOn: PreDeploymentApprovalJob
            condition: succeeded()
            timeoutInMinutes: 0
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-nuget-drop"
                  targetPath: "$(Pipeline.Workspace)/prod/gen-usage-nuget-prod-drop"
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-planner-drop"
                  targetPath: "$(Pipeline.Workspace)/prod/gen-usage-planner-prod-drop"
                - input: pipelineArtifact
                  pipeline: "apis-of-dotnet-gen-usage-build"
                  artifactName: "gen-usage-drop"
                  targetPath: "$(Pipeline.Workspace)/prod/gen-usage-prod-drop"
            steps:
              - task: AzureCLI@2
                displayName: Run GenUsageNuGet (Prod)
                timeoutInMinutes: 0
                inputs:
                  azureSubscription: "$(AzureProdSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/prod/gen-usage-nuget-prod-drop/GenUsageNuGet.dll" -- crawl
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrlProd)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecretProd)
                  GENUSAGE_NUGET_CATALOG_DOP: "2"
                  GENUSAGE_NUGET_HTTP_TIMEOUT_SECONDS: "36000"
                  GENUSAGE_NUGET_CRAWL_TIMEOUT_HOURS: "3"
                  GENUSAGE_NUGET_CRAWL_WORKERS: "16"
              - task: AzureCLI@2
                displayName: Run GenUsagePlanner (Prod)
                timeoutInMinutes: 0
                inputs:
                  azureSubscription: "$(AzureProdSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/prod/gen-usage-planner-prod-drop/GenUsagePlanner.dll"
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrlProd)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecretProd)
              - task: AzureCLI@2
                displayName: Run GenUsage (Prod)
                timeoutInMinutes: 0
                dependsOn: 
                  - Run GenUsageNuGet (Prod)
                  - Run GenUsagePlanner (Prod)
                inputs:
                  azureSubscription: "$(AzureProdSubscriptionConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    dotnet "$(Pipeline.Workspace)/prod/gen-usage-prod-drop/GenUsage.dll"
                env:
                  DOTNET_ENVIRONMENT: "Release"
                  AzureStorageServiceUrl: $(AzureStorageServiceUrlProd)
                  ApisOfDotNetWebHookSecret: $(ApisOfDotNetWebHookSecretProd)
