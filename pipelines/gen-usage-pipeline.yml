---
trigger: none

name: $(date:yyyyMMdd)$(rev:.r)
variables:
  - name: BuildConfiguration
    value: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main

schedules:
  - cron: '21 */6 * * *' # At :21 in every 6th hour
    displayName: "Generate usage every 6 hours"
    branches:
      include:
        - main
    always: true

pool:
  name: AzurePipelines-EO
  image: 1ESPT-Ubuntu22.04
  os: linux
stages:
  - stage: GenerateUsage
    jobs:
      job: job_1
      displayName: Publish Dev Artifacts
      timeoutInMinutes: 0
      templateContext:
        outputs:
          - output: pipelineArtifact
            displayName: "Publish GenUsageNuGet Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/dev/publish-gen-usage-nuget
            artifactName: gen-usage-nuget-dev-drop
          - output: pipelineArtifact
            displayName: "Publish GenUsagePlanner Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/dev/publish-gen-usage-planner
            artifactName: gen-usage-planner-dev-drop
          - output: pipelineArtifact
            displayName: "Publish GenUsage Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/dev/publish-gen-usage
            artifactName: gen-usage-dev-drop
      steps:
        - template: /pipelines/templates/stages-gen-usage.yml@self
          parameters:
            BuildType: dev
      job: job_2
      displayName: Publish Prod Artifacts
      timeoutInMinutes: 0
      templateContext:
        outputs:
          - output: pipelineArtifact
            displayName: "Publish GenUsageNuGet Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/prod/publish-gen-usage-nuget
            artifactName: gen-usage-nuget-prod-drop
          - output: pipelineArtifact
            displayName: "Publish GenUsagePlanner Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/prod/publish-gen-usage-planner
            artifactName: gen-usage-planner-prod-drop
          - output: pipelineArtifact
            displayName: "Publish GenUsage Artifact"
            targetPath: $(Build.ArtifactStagingDirectory)/prod/publish-gen-usage
            artifactName: gen-usage-prod-drop
      steps:
        - template: /pipelines/templates/stages-gen-usage.yml@self
          parameters:
            BuildType: prod