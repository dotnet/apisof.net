---
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pipelines/build-planner.yml
      - pipelines/templates/steps-build-planner.yml
      - src/NetUpgradePlanner/**
      - src/Terrajobst.ApiCatalog/**
      - src/Terrajobst.NetUpgradePlanner/**
      - src/Terrajobst.NetUpgradePlanner.Excel/**
      - src/Terrajobst.UsageCrawling/**
name: $(date:yyyyMMdd)$(rev:.r)
variables:
  BuildConfiguration: Release
resources:
  repositories:
    - repository: self
      type: git
      ref: main
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: true
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Windows2022
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: Dev
        jobs:
          - job: build_and_upload_dev
            displayName: Build and upload planner to Dev environment
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "build-planner"
                  artifactName: planner-release
                  targetPath: $(Pipeline.Workspace)/planner-release
            steps:
              - template: ../templates/upload-build-planner.yml@self
                displayName: Upload planner release to Dev environment
                parameters:
                  azureSubscriptionConnection: $(AzureSubscriptionConnectionDev)
                  storageAccountName: $(StorageAccountNameDev)
      - stage: Prod
        jobs:
          - job: PreDeploymentApprovalJob
            displayName: Pre-Deployment Approval
            condition: succeeded()
            timeoutInMinutes: 43200
            pool: server
            steps:
              - task: ManualValidation@1
                inputs:
                  notifyUsers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
                  approvers: |-
                    Chris.Sfanos@microsoft.com,
                    v-danzhu1@microsoft.com
          - job: build_and_upload_planner_prod
            displayName: Build and upload planner to Prod environment
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: "build-planner"
                  artifactName: planner-release
                  targetPath: $(Pipeline.Workspace)/planner-release
            steps:
              - template: ../templates/upload-build-planner.yml@self
                displayName: Upload planner release to Prod environment
                parameters:
                  azureSubscriptionConnection: $(AzureSubscriptionConnectionProd)
                  storageAccountName: $(StorageAccountNameProd)